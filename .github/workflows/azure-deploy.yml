name: Azure Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Create deployment zip
        run: |
          zip -r deploy.zip \
            app components lib prisma public server stores types scripts \
            .env.example .eslintrc.json .gitignore docker-compose.yml Dockerfile \
            next-env.d.ts next.config.js package.json package-lock.json \
            postcss.config.js README.md render.yaml tailwind.config.js tsconfig.json

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service for faster deploys
        run: |
          az webapp config appsettings set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --settings WEBSITE_RUN_FROM_PACKAGE=0 SCM_DO_BUILD_DURING_DEPLOYMENT=true

          az webapp config set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --always-on true \
            --startup-file "npm start"

      - name: Deploy zip package
        run: |
          az webapp deploy \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --src-path deploy.zip \
            --type zip

      - name: Smoke check
        run: |
          curl -fsSL "https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
